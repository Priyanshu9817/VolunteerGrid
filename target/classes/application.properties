# =============================================================
#  VolunteerGrid – Application Configuration
# =============================================================

spring.application.name=VolunteerGrid

# ----- DataSource -----
spring.datasource.url=jdbc:mysql://localhost:3306/volunteergrid?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ----- Thymeleaf -----
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ----- Server -----
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ----- Logging -----
logging.level.com.volunteergrid=DEBUG
logging.level.org.springframework.security=WARN

# ----- Multipart (if file upload added later) -----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
