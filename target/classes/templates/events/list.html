<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head}">
    <title>Events | VolunteerGrid</title>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="vg-app-layout">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="vg-main-content vg-fade-in">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="vg-page-header d-flex justify-content-between align-items-center">
            <div>
                <h1 class="vg-page-title">
                    <i class="bi bi-calendar-event text-accent me-2"></i>All Events
                </h1>
                <p class="vg-page-subtitle" th:text="${events.size()} + ' events found'"></p>
            </div>
            <a th:href="@{/organizer/events/new}"
               sec:authorize="hasAnyRole('ORGANIZER','ADMIN')"
               class="btn btn-accent">
                <i class="bi bi-plus-circle me-1"></i>New Event
            </a>
        </div>

        <div class="vg-card vg-event-toolbar mb-4">
            <div class="row g-2 align-items-center">
                <div class="col-lg-8">
                    <label class="visually-hidden" for="event-search">Search events</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-vg text-muted">
                            <i class="bi bi-search"></i>
                        </span>
                        <input id="event-search" type="search" class="form-control"
                               data-event-search placeholder="Search by event, venue, or organizer..."
                               autocomplete="off"/>
                    </div>
                </div>
                <div class="col-lg-4">
                    <label class="visually-hidden" for="event-status">Filter by status</label>
                    <select id="event-status" class="form-select" data-event-status>
                        <option value="">All statuses</option>
                        <option th:each="s : ${T(com.volunteergrid.entity.EventStatus).values()}"
                                th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div th:if="${events.empty}" class="vg-empty-state vg-card">
            <i class="bi bi-calendar-x d-block"></i>
            <p>No events available yet.</p>
        </div>

        <div th:unless="${events.empty}" class="row g-3">
            <div class="col-md-6 col-xl-4 vg-event-column" th:each="ev : ${events}">
                <div class="vg-event-card h-100 d-flex flex-column">
                    <div data-event-card
                         th:attr="data-event-search=${ev.title + ' ' + ev.venue + ' ' + ev.organizerName},
                                  data-event-status=${ev.status}"></div>
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span th:replace="~{fragments/layout :: statusBadge(${ev.status})}"></span>
                        <small class="text-muted">
                            <i class="bi bi-layers me-1"></i>
                            <span th:text="${ev.shiftCount}"></span> shifts
                        </small>
                    </div>

                    <h5 class="fw-700 mb-1 flex-grow-1">
                        <a th:href="@{/events/{id}(id=${ev.id})}"
                           class="text-white text-decoration-none"
                           th:text="${ev.title}">Title</a>
                    </h5>

                    <p class="text-muted mb-1" style="font-size:0.85rem;">
                        <i class="bi bi-person-workspace me-1"></i>
                        <span th:text="${ev.organizerName}"></span>
                    </p>
                    <p class="text-muted mb-1" style="font-size:0.85rem;">
                        <i class="bi bi-geo-alt me-1"></i>
                        <span th:text="${ev.venue}"></span>
                    </p>
                    <p class="text-muted mb-3" style="font-size:0.82rem;">
                        <i class="bi bi-clock me-1"></i>
                        <span th:text="${#temporals.format(ev.startTime,'dd MMM yyyy, HH:mm')}"></span>
                        &nbsp;–&nbsp;
                        <span th:text="${#temporals.format(ev.endTime,'HH:mm')}"></span>
                    </p>

                    <a th:href="@{/events/{id}(id=${ev.id})}"
                       class="btn btn-accent btn-sm mt-auto">
                        <i class="bi bi-arrow-right me-1"></i>View Details
                    </a>
                </div>
            </div>
        </div>
        <div data-filter-empty class="vg-empty-state vg-card d-none mt-3">
            <i class="bi bi-search d-block"></i>
            <p class="mb-0">No events match your search.</p>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
