<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Error | VolunteerGrid</title>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="vg-auth-page">
    <div class="vg-auth-card text-center" style="max-width:480px;">
        <div class="mb-3">
            <span style="font-size:4rem;"
                  th:text="${status == 404 ? '🔍' : status == 403 ? '🚫' : status == 400 ? '⚠️' : '💥'}">
            </span>
        </div>
        <h2 class="fw-800 text-accent" th:text="${status}">Error</h2>
        <h4 class="fw-700 mb-3" th:text="${error}">Error Type</h4>
        <p class="text-muted mb-4" th:text="${message}">Something went wrong.</p>
        <div class="d-flex gap-2 justify-content-center">
            <a href="javascript:history.back()" class="btn vg-btn-outline">
                <i class="bi bi-arrow-left me-1"></i>Go Back
            </a>
            <a th:href="@{/dashboard}" class="btn btn-accent">
                <i class="bi bi-house me-1"></i>Dashboard
            </a>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
