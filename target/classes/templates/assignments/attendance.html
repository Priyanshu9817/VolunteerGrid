<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Attendance | VolunteerGrid</title>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="vg-app-layout">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="vg-main-content vg-fade-in">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="vg-page-header">
            <h1 class="vg-page-title">
                <i class="bi bi-check2-circle text-accent me-2"></i>Attendance Management
            </h1>
            <p class="vg-page-subtitle">Mark check-in and check-out for volunteers</p>
        </div>

        <div th:if="${assignments.empty}" class="vg-empty-state vg-card">
            <i class="bi bi-people d-block"></i>
            <p>No approved assignments for this event.</p>
        </div>

        <div th:unless="${assignments.empty}" class="vg-card">
            <div class="vg-table">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Volunteer</th>
                            <th>Task</th>
                            <th>Shift Time</th>
                            <th>Status</th>
                            <th>Check-In</th>
                            <th>Check-Out</th>
                            <th>Hours</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${assignments}"
                            th:unless="${a.status.name() == 'WITHDRAWN' or a.status.name() == 'REJECTED'}">
                            <td>
                                <div class="fw-600" th:text="${a.volunteerName}">-</div>
                                <div class="text-muted" style="font-size:0.8rem;"
                                     th:text="${a.volunteerEmail}">-</div>
                            </td>
                            <td th:text="${a.shiftTaskName}">-</td>
                            <td class="text-muted" style="font-size:0.82rem;">
                                <span th:text="${#temporals.format(a.shiftStartTime,'HH:mm')}"></span>
                                &nbsp;–&nbsp;
                                <span th:text="${#temporals.format(a.shiftEndTime,'HH:mm')}"></span>
                            </td>
                            <td>
                                <span th:replace="~{fragments/layout :: assignmentBadge(${a.status})}"></span>
                            </td>
                            <td class="text-muted" style="font-size:0.85rem;"
                                th:text="${a.checkInTime != null ? #temporals.format(a.checkInTime,'HH:mm') : '—'}">-</td>
                            <td class="text-muted" style="font-size:0.85rem;"
                                th:text="${a.checkOutTime != null ? #temporals.format(a.checkOutTime,'HH:mm') : '—'}">-</td>
                            <td th:text="${a.completedHours != null ? #numbers.formatDecimal(a.completedHours,1,1) + ' h' : '—'}">-</td>
                            <td>
                                <div class="d-flex gap-2">
                                    <!-- Check In -->
                                    <form th:if="${a.checkInTime == null}"
                                          th:action="@{/organizer/assignments/{id}/checkin(id=${a.id})}"
                                          method="post">
                                        <input type="hidden" name="eventId" th:value="${eventId}"/>
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-sm"
                                                style="background:rgba(16,185,129,0.15); color:#10b981; border:1px solid #10b981; white-space:nowrap;">
                                            <i class="bi bi-box-arrow-in-right me-1"></i>Check In
                                        </button>
                                    </form>

                                    <!-- Check Out -->
                                    <form th:if="${a.checkInTime != null and a.checkOutTime == null}"
                                          th:action="@{/organizer/assignments/{id}/checkout(id=${a.id})}"
                                          method="post">
                                        <input type="hidden" name="eventId" th:value="${eventId}"/>
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-sm"
                                                style="background:rgba(99,102,241,0.15); color:#818cf8; border:1px solid #818cf8; white-space:nowrap;">
                                            <i class="bi bi-box-arrow-right me-1"></i>Check Out
                                        </button>
                                    </form>

                                    <span th:if="${a.checkOutTime != null}"
                                          class="badge badge-completed">Done</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
