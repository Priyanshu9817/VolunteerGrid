<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Shift Form | VolunteerGrid</title>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="vg-app-layout">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="vg-main-content vg-fade-in">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="vg-page-header">
            <h1 class="vg-page-title">
                <i class="bi bi-clock-history text-accent me-2"></i>
                <span th:text="${shiftDto.id != null ? 'Edit Shift' : 'Add Shift'}"></span>
            </h1>
            <p class="vg-page-subtitle" th:text="${event.title}"></p>
        </div>

        <div class="vg-form-card">
            <form th:action="${shiftDto.id != null ?
                               '/organizer/shifts/' + shiftDto.id + '/edit' :
                               '/organizer/events/' + event.id + '/shifts/new'}"
                  th:object="${shiftDto}"
                  method="post" novalidate>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{eventId}"/>

                <div th:if="${errorMsg}" class="alert alert-danger vg-alert mb-3">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMsg}"></span>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="sh-task">Task Name *</label>
                    <input type="text" id="sh-task" th:field="*{taskName}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('taskName')} ? 'is-invalid'"
                           placeholder="e.g. Registration Desk"/>
                    <div class="invalid-feedback" th:errors="*{taskName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="sh-venue">Venue *</label>
                    <input type="text" id="sh-venue" th:field="*{venue}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('venue')} ? 'is-invalid'"
                           placeholder="e.g. Main Gate"/>
                    <div class="invalid-feedback" th:errors="*{venue}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="sh-start">Start Time *</label>
                        <input type="datetime-local" id="sh-start" th:field="*{startTime}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{startTime}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="sh-end">End Time *</label>
                        <input type="datetime-local" id="sh-end" th:field="*{endTime}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{endTime}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="sh-cap">Capacity (max volunteers) *</label>
                    <input type="number" id="sh-cap" th:field="*{capacity}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid'"
                           min="1" placeholder="e.g. 5"/>
                    <div class="invalid-feedback" th:errors="*{capacity}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-accent px-4">
                        <i class="bi bi-check-lg me-1"></i>
                        <span th:text="${shiftDto.id != null ? 'Save Changes' : 'Create Shift'}"></span>
                    </button>
                    <a th:href="@{/events/{id}(id=${event.id})}"
                       class="btn vg-btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
