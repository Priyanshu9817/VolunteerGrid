<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Manage Users | VolunteerGrid</title>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="vg-app-layout">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="vg-main-content vg-fade-in">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="vg-page-header d-flex justify-content-between align-items-center">
            <div>
                <h1 class="vg-page-title">
                    <i class="bi bi-people text-accent me-2"></i>User Management
                </h1>
                <p class="vg-page-subtitle" th:text="${users.size()} + ' users registered'"></p>
            </div>
            <a th:href="@{/admin/users/new}" class="btn btn-accent">
                <i class="bi bi-person-plus me-1"></i>Add User
            </a>
        </div>

        <div class="vg-card">
            <div class="vg-table">
                <table class="table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Toggle</th>
                            <th>Change Role</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u, st : ${users}">
                            <td class="text-muted" th:text="${st.index + 1}">-</td>
                            <td class="fw-600" th:text="${u.name}">-</td>
                            <td class="text-muted" style="font-size:0.85rem;"
                                th:text="${u.email}">-</td>
                            <td>
                                <span class="badge vg-role-badge" th:text="${u.role}"></span>
                            </td>
                            <td>
                                <span th:if="${u.enabled}" class="badge badge-open">Active</span>
                                <span th:unless="${u.enabled}" class="badge badge-closed">Disabled</span>
                            </td>
                            <td>
                                <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm vg-btn-outline"
                                            th:text="${u.enabled ? 'Disable' : 'Enable'}">Toggle</button>
                                </form>
                            </td>
                            <td>
                                <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post"
                                      class="d-flex gap-2">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <select name="role" class="form-select form-select-sm"
                                            style="max-width:130px;">
                                        <option value="ADMIN"     th:selected="${u.role.name() == 'ADMIN'}">Admin</option>
                                        <option value="ORGANIZER" th:selected="${u.role.name() == 'ORGANIZER'}">Organizer</option>
                                        <option value="VOLUNTEER" th:selected="${u.role.name() == 'VOLUNTEER'}">Volunteer</option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-accent">Set</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
